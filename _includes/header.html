<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand-mark" aria-hidden="true">&gt;_</span>
      <span>
        <span class="brand-name">{{ site.title }}</span>
        <span class="brand-tag">{{ site.description }}</span>
      </span>
    </a>
    <nav class="site-nav" aria-label="Primary">
      {% assign here = page.url %}
      <a href="{{ '/' | relative_url }}"{% if here == '/' or here contains '/page/' %} aria-current="page"{% endif %}>Home</a>
      <a href="{{ '/writeups/' | relative_url }}"{% if here == '/writeups/' %} aria-current="page"{% endif %}>Writeups</a>
      <a href="{{ '/labs/' | relative_url }}"{% if here == '/labs/' %} aria-current="page"{% endif %}>Labs</a>
      <a href="{{ '/tags/' | relative_url }}"{% if here == '/tags/' %} aria-current="page"{% endif %}>Tags</a>
      <a href="{{ '/about/' | relative_url }}"{% if here == '/about/' %} aria-current="page"{% endif %}>About</a>
    </nav>
  </div>
</header>
